<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Màn Hình Lời Chúc Hologram Vũ Trụ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Be Vietnam Pro & Space Grotesk hỗ trợ tiếng Việt sắc nét -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --space-void: #020308;
            --holo-cyan: #38bdf8;
            --holo-bright: #7dd3fc;
            --holo-violet: #a855f7;
            --holo-emerald: #34d399;
            --red-core: #ff1e42;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: var(--space-void);
            color: #e0f2fe;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            margin: 0;
        }

        /* Canvas nền vũ trụ Galaxy toàn màn hình */
        #galaxy-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Chùm tia chiếu Hologram từ đế máy phát lên */
        .projector-beam {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            height: 85px;
            background: radial-gradient(ellipse at 50% 100%, rgba(56, 189, 248, 0.32) 0%, rgba(168, 85, 247, 0.12) 45%, transparent 75%);
            filter: blur(10px);
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.85s ease, transform 0.85s ease;
        }

        /* Khung máy chiếu Hologram nổi giữa không gian với góc vát kỹ thuật */
        .holo-frame {
            position: relative;
            background: linear-gradient(160deg, rgba(10, 22, 42, 0.62) 0%, rgba(6, 12, 26, 0.76) 50%, rgba(18, 12, 38, 0.64) 100%);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.38);
            box-shadow:
                0 0 50px rgba(56, 189, 248, 0.14),
                0 0 90px rgba(168, 85, 247, 0.12),
                inset 0 0 36px rgba(56, 189, 248, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            clip-path: polygon(
                22px 0%, calc(100% - 22px) 0%,
                100% 22px, 100% calc(100% - 22px),
                calc(100% - 22px) 100%, 22px 100%,
                0% calc(100% - 22px), 0% 22px
            );
            transition: opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1), transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), filter 0.9s ease;
            animation: holoFloat 6.5s ease-in-out infinite;
        }

        /* Biến mất hoàn toàn khỏi khung cảnh để lộ nền vũ trụ Galaxy */
        .holo-vanished {
            opacity: 0 !important;
            transform: scale(0.92) translateY(10px) !important;
            filter: blur(12px) brightness(1.4) !important;
            pointer-events: none !important;
            animation: none !important;
        }

        @keyframes holoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        /* Lưới tọa độ Hologram 3D mờ & đường quét năng lượng */
        .holo-grid-overlay {
            background-image:
                linear-gradient(rgba(56, 189, 248, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.06) 1px, transparent 1px),
                radial-gradient(circle at 50% 42%, rgba(56, 189, 248, 0.12) 0%, transparent 72%);
            background-size: 28px 28px, 28px 28px, 100% 100%;
        }

        /* Tia quét Hologram di chuyển dọc */
        .holo-scanline {
            position: absolute;
            left: 0;
            right: 0;
            height: 36px;
            background: linear-gradient(180deg, transparent 0%, rgba(56, 189, 248, 0.12) 50%, rgba(125, 211, 252, 0.35) 96%, transparent 100%);
            pointer-events: none;
            z-index: 12;
            opacity: 0.55;
            animation: holoScan 5.2s linear infinite;
        }

        @keyframes holoScan {
            0% { top: -10%; opacity: 0; }
            12% { opacity: 0.55; }
            88% { opacity: 0.55; }
            100% { top: 105%; opacity: 0; }
        }

        /* Góc ngắm kỹ thuật Hologram */
        .holo-corner {
            position: absolute;
            width: 18px;
            height: 18px;
            border-color: rgba(125, 211, 252, 0.8);
            pointer-events: none;
            z-index: 15;
            filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
        }

        /* Hiệu ứng BẬT / TẮT màn hình Hologram/CRT kinh điển */
        .crt-layer {
            position: relative;
            width: 100%;
            height: 100%;
            transform-origin: center center;
            will-change: transform, opacity, filter;
        }

        /* Trạng thái tắt hoàn toàn */
        .crt-layer.screen-off {
            opacity: 0;
            transform: scaleY(0.004) scaleX(0.001);
            filter: brightness(4);
            pointer-events: none;
        }

        /* Animation bật màn hình: bung tia sáng ngang rồi mở rộng dọc */
        .crt-layer.anim-turn-on {
            animation: holoTurnOn 0.58s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes holoTurnOn {
            0% {
                opacity: 0;
                transform: scaleY(0.006) scaleX(0.02);
                filter: brightness(5) blur(2px);
            }
            38% {
                opacity: 1;
                transform: scaleY(0.008) scaleX(1);
                filter: brightness(3.2) blur(1px);
            }
            100% {
                opacity: 1;
                transform: scaleY(1) scaleX(1);
                filter: brightness(1) blur(0px);
            }
        }

        /* Animation tắt màn hình: ép thành dải sáng ngang rực rỡ rồi co thành điểm sáng và tắt */
        .crt-layer.anim-turn-off {
            animation: holoTurnOff 0.65s cubic-bezier(0.55, 0.05, 0.68, 0.19) forwards;
            pointer-events: none;
        }

        @keyframes holoTurnOff {
            0% {
                opacity: 1;
                transform: scaleY(1) scaleX(1);
                filter: brightness(1);
            }
            48% {
                opacity: 1;
                transform: scaleY(0.008) scaleX(1.02);
                filter: brightness(3.8);
            }
            82% {
                opacity: 0.95;
                transform: scaleY(0.005) scaleX(0.04);
                filter: brightness(5);
            }
            100% {
                opacity: 0;
                transform: scaleY(0.002) scaleX(0);
                filter: brightness(6);
            }
        }

        /* Ánh sáng tia ngang bổ trợ khi tắt/bật màn hình */
        .flash-beam-line {
            position: absolute;
            top: 44%;
            left: 50%;
            width: 92%;
            height: 3px;
            transform: translate(-50%, -50%) scaleX(0);
            background: radial-gradient(circle, #ffffff 0%, #7dd3fc 50%, transparent 100%);
            box-shadow: 0 0 24px #38bdf8, 0 0 48px #ffffff;
            border-radius: 9999px;
            opacity: 0;
            pointer-events: none;
            z-index: 25;
        }

        .flash-beam-line.trigger-flash {
            animation: beamFlare 0.65s ease-out forwards;
        }

        @keyframes beamFlare {
            0% { opacity: 0; transform: translate(-50%, -50%) scaleX(0.95); }
            45% { opacity: 1; transform: translate(-50%, -50%) scaleX(1); }
            80% { opacity: 0.9; transform: translate(-50%, -50%) scaleX(0.03); }
            100% { opacity: 0; transform: translate(-50%, -50%) scaleX(0); }
        }

        /* Ánh sáng chữ Hologram sắc nét, dễ đọc */
        .holo-text {
            color: #e0f2fe;
            text-shadow:
                0 0 10px rgba(56, 189, 248, 0.45),
                0 0 22px rgba(56, 189, 248, 0.18);
        }

        .holo-text-closing {
            color: #a7f3d0;
            text-shadow:
                0 0 12px rgba(52, 211, 153, 0.55),
                0 0 24px rgba(56, 189, 248, 0.25);
        }

        /* Con trỏ gõ chữ Hologram */
        .holo-cursor {
            display: inline-block;
            width: 8px;
            height: 1.15em;
            background: linear-gradient(180deg, #7dd3fc 0%, #38bdf8 100%);
            box-shadow: 0 0 10px #38bdf8, 0 0 18px rgba(56, 189, 248, 0.8);
            vertical-align: text-bottom;
            margin-left: 4px;
            border-radius: 1px;
            animation: cursorBlink 0.75s steps(2, start) infinite;
        }

        @keyframes cursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Vòng quỹ đạo xoay quanh nút nguồn đỏ */
        .orbit-ring {
            border: 1px dashed rgba(56, 189, 248, 0.45);
            animation: spinOrbit 14s linear infinite;
        }

        @keyframes spinOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Đế nút nguồn đỏ năng lượng */
        .power-socket {
            background: radial-gradient(circle, rgba(255, 30, 66, 0.22) 0%, rgba(8, 15, 30, 0.88) 72%);
            border: 1.5px solid rgba(255, 30, 66, 0.45);
            box-shadow:
                inset 0 4px 12px rgba(0, 0, 0, 0.9),
                0 0 26px rgba(255, 30, 66, 0.24);
        }

        /* Nút bấm đỏ 3D chỉ có biểu tượng nguồn */
        .holo-red-btn {
            background: radial-gradient(circle at 35% 28%, #ff6b81 0%, #f01338 52%, #9e0820 100%);
            border: 1.5px solid #ff9eb0;
            box-shadow:
                0 5px 0 #630312,
                0 10px 26px rgba(255, 30, 66, 0.65),
                inset 0 2px 5px rgba(255, 255, 255, 0.6);
            transition: transform 0.08s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.08s ease, filter 0.15s ease;
        }

        .holo-red-btn:hover {
            filter: brightness(1.1);
            box-shadow:
                0 5px 0 #630312,
                0 12px 32px rgba(255, 30, 66, 0.85),
                inset 0 2px 6px rgba(255, 255, 255, 0.75);
        }

        .holo-red-btn:active, .holo-red-btn.pressed {
            transform: translateY(4px);
            box-shadow:
                0 1px 0 #630312,
                0 4px 14px rgba(255, 30, 66, 0.55),
                inset 0 2px 6px rgba(0, 0, 0, 0.35);
        }

        .pulse-wave {
            animation: waveOut 2.5s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }

        @keyframes waveOut {
            0% { transform: scale(0.95); opacity: 0.75; }
            85% { transform: scale(1.32); opacity: 0; }
            100% { transform: scale(1.32); opacity: 0; }
        }

        /* Thanh cuộn siêu mảnh */
        .holo-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .holo-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .holo-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
        }

        /* Lớp ánh sáng gia tốc trung tâm khi lao vút vào không gian */
        .warp-vignette {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at 50% 50%, rgba(125, 211, 252, 0.04) 0%, rgba(56, 189, 248, 0.14) 55%, rgba(2, 3, 8, 0.78) 100%);
            transition: opacity 0.55s ease;
        }

        .warp-vignette.is-warping {
            opacity: 1;
        }

        /* Vòng tròn khẩu độ warp ở trung tâm màn hình (giữ vùng tròn rõ nét, không tụ thành 1 điểm) */
        .warp-center-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: clamp(130px, 24vw, 250px);
        /* Vòng tròn khẩu độ warp ở trung tâm màn hình (giữ vùng tròn thông thoáng, không vẽ đường viền/vòng tròn) */
        .warp-center-ring {
            position: fixed;
            top: 50%;
            left: 50%;
            width: clamp(130px, 24vw, 250px);
            height: clamp(130px, 24vw, 250px);
            border-radius: 9999px;
            transform: translate(-50%, -50%) scale(0.75);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            background: radial-gradient(
                circle,
                rgba(2, 3, 8, 0.28) 0%,
                rgba(2, 3, 8, 0.12) 65%,
                rgba(2, 3, 8, 0) 100%
            );
            transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), transform 1.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .warp-center-ring.is-active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.22);
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-6 min-h-screen">

    <!-- NỀN VŨ TRỤ GALAXY ĐA TẦNG -->
    <canvas id="galaxy-canvas"></canvas>

    <!-- LỚP ÁNH SÁNG TĂNG TỐC GIA TỐC -->
    <div id="warp-vignette" class="warp-vignette" aria-hidden="true"></div>
    <div id="warp-center-ring" class="warp-center-ring" aria-hidden="true"></div>

    <!-- MÀN HÌNH HOLOGRAM TRUNG TÂM -->
    <main id="holo-stage" class="relative z-10 w-full max-w-2xl flex flex-col items-center">
        
        <!-- Quầng sáng máy chiếu Hologram phía dưới -->
        <div id="projector-beam" class="projector-beam opacity-55" aria-hidden="true"></div>

        <!-- Khung máy Hologram nổi -->
        <div id="holo-frame" class="holo-frame holo-grid-overlay w-full h-[460px] sm:h-[500px] flex flex-col justify-between p-4 sm:p-6">
            
            <!-- Tia quét năng lượng Hologram -->
            <div class="holo-scanline" aria-hidden="true"></div>

            <!-- 4 góc ngắm kỹ thuật Hologram -->
            <span class="holo-corner top-3 left-3 border-t-2 border-l-2"></span>
            <span class="holo-corner top-3 right-3 border-t-2 border-r-2"></span>
            <span class="holo-corner bottom-3 left-3 border-b-2 border-l-2"></span>
            <span class="holo-corner bottom-3 right-3 border-b-2 border-r-2"></span>

            <!-- Dải vạch kỹ thuật tinh tế trên đỉnh màn hình -->
            <div class="flex items-center justify-between px-3 pt-0.5 z-20 opacity-75" aria-hidden="true">
                <div class="flex items-center gap-1.5">
                    <span id="status-dot" class="w-2 h-2 rounded-full bg-cyan-400 shadow-[0_0_8px_#38bdf8] transition-colors duration-300"></span>
                    <span class="w-8 h-[2px] bg-gradient-to-r from-cyan-400/70 to-transparent rounded-full"></span>
                </div>
                <div class="flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-purple-400/60"></span>
                    <span class="w-6 h-[2px] bg-gradient-to-l from-purple-400/70 to-transparent rounded-full"></span>
                </div>
            </div>

            <!-- Tia sáng ngang lóe lên khi tắt/bật màn hình -->
            <div id="flash-beam-line" class="flash-beam-line" aria-hidden="true"></div>

            <!-- VÙNG NỘI DUNG HOLOGRAM (CÓ HIỆU ỨNG BẬT / TẮT CRT-HOLOGRAM) -->
            <div class="relative flex-1 my-2 overflow-hidden flex items-center justify-center">
                <div id="crt-screen-layer" class="crt-layer screen-off flex flex-col justify-between">
                    
                    <!-- Vùng hiển thị dòng chữ gõ -->
                    <div id="text-viewport" class="holo-scroll flex-1 overflow-y-auto px-2 sm:px-6 flex flex-col justify-center">
                        <div id="typed-lines-container" class="space-y-3 sm:space-y-3.5 text-left text-[14px] sm:text-[16px] md:text-[17px] leading-[1.68] font-normal">
                            <!-- Các đoạn văn bản được gõ từng ký tự -->
                        </div>
                    </div>

                    <!-- Thanh tiến trình ánh sáng cực mảnh báo thời gian đọc trước khi tự tắt -->
                    <div class="w-full px-6 pt-2">
                        <div class="w-full h-[2px] bg-cyan-950/60 rounded-full overflow-hidden">
                            <div id="reading-timer-bar" class="h-full w-0 bg-gradient-to-r from-cyan-400 via-sky-300 to-purple-400 shadow-[0_0_8px_#38bdf8]"></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- NÚT BẤM ĐỎ BIỂU TƯỢNG NGUỒN NẰM HẲN TRONG PHẦN DƯỚI MÀN HÌNH -->
            <div class="flex flex-col items-center justify-center pt-1 pb-1 z-20">
                <div class="power-socket relative w-20 h-20 sm:w-24 sm:h-24 rounded-full flex items-center justify-center">
                    <!-- Vòng quỹ đạo xoay nhẹ -->
                    <span class="orbit-ring absolute -inset-1.5 rounded-full pointer-events-none"></span>
                    <!-- Vòng sóng xung mời gọi -->
                    <span id="btn-pulse-wave" class="pulse-wave absolute inset-0 rounded-full border border-rose-500/65 pointer-events-none"></span>

                    <!-- Nút bấm đỏ 3D chỉ có biểu tượng nguồn Power -->
                    <button id="holo-power-btn" type="button" aria-label="Bật màn hình lời chúc"
                        class="holo-red-btn w-[62px] h-[62px] sm:w-[74px] sm:h-[74px] rounded-full text-white flex items-center justify-center cursor-pointer focus:outline-none">
                        <svg id="power-svg-icon" xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 sm:w-8 sm:h-8 drop-shadow-[0_0_10px_rgba(255,255,255,0.9)] transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.4">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v9m6.364-6.364a9 9 0 11-12.728 0" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        /**
         * NỘI DUNG LỜI CHÚC TRI ÂN CUỐI ĐỢT KIẾN TẬP (3 ĐOẠN)
         */
        const WISH_PARAGRAPHS = [
            "Chào các em, thầy cảm ơn mấy đứa đã đồng hành cùng thầy trong đợt kiến tập này, dù tụi mình chưa có nhiều cơ hội để trò chuyện và thầy cũng ít tham gia hoạt động cùng lớp nên còn chưa hiểu về các em, nhưng thầy cảm thấy rất vui vì được đến với lớp của mấy đứa.",
            "Thầy chúc mấy đứa sẽ đạt được thành công và thực hiện được những gì mình mong ước.",
            "Hẹn gặp mấy đứa vào một ngày nào đó nếu có cơ hội."
        ];

        /**
         * 1. HIỆU ỨNG NỀN VŨ TRỤ GALAXY (NEBULA + WARP STARS + SHOOTING STARS)
         */
        class GalaxyBackground {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.stars = [];
                this.shootingStars = [];
                this.width = 0;
                this.height = 0;
                this.time = 0;
                this.warpFactor = 1;
                this.targetWarpFactor = 1;
                this.warpIntensity = 0;

                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.animate();
            }

            setWarpAcceleration(active) {
                this.targetWarpFactor = active ? 18 : 1;
            }

            getApertureRadius() {
                const minDim = Math.min(this.width, this.height);
                const baseRadius = Math.max(66, Math.min(126, minDim * 0.125));
                return baseRadius * (0.76 + this.warpIntensity * 0.48);
            }

            resize() {
                this.width = this.canvas.width = window.innerWidth;
                this.height = this.canvas.height = window.innerHeight;
                this.initStars();
            }

            initStars() {
                const count = Math.min(280, Math.floor((this.width * this.height) / 4800));
                this.stars = [];
                const palette = ['#ffffff', '#bae6fd', '#e9d5ff', '#fbcfe8', '#7dd3fc'];

                for (let i = 0; i < count; i++) {
                    const depth = Math.random(); // 0: xa, 1: gần
                    this.stars.push({
                        x: Math.random() * this.width,
                        y: Math.random() * this.height,
                        prevX: 0,
                        prevY: 0,
                        radius: 0.45 + depth * 1.45,
                        speedX: (0.04 + depth * 0.14),
                        speedY: -(0.02 + depth * 0.06),
                        baseAlpha: 0.25 + depth * 0.65,
                        twinkleSpeed: 0.015 + Math.random() * 0.035,
                        phase: Math.random() * Math.PI * 2,
                        color: palette[Math.floor(Math.random() * palette.length)]
                    });
                }

                for (const s of this.stars) {
                    s.prevX = s.x;
                    s.prevY = s.y;
                }
            }

            spawnShootingStar() {
                if (this.shootingStars.length > 2 || this.warpFactor > 3) return;
                this.shootingStars.push({
                    x: Math.random() * this.width * 0.85,
                    y: Math.random() * this.height * 0.45,
                    len: 90 + Math.random() * 90,
                    speed: 11 + Math.random() * 7,
                    angle: Math.PI / 4 + (Math.random() - 0.5) * 0.2,
                    alpha: 1
                });
            }

            drawNebula() {
                const ctx = this.ctx;
                ctx.fillStyle = '#020308';
                ctx.fillRect(0, 0, this.width, this.height);

                const cx = this.width * 0.5;
                const cy = this.height * 0.48;
                const maxR = Math.max(this.width, this.height) * 0.72;
                const warpStretch = 1 + (this.warpFactor - 1) * 0.045;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.scale(warpStretch, 1);
                ctx.translate(-cx, -cy);

                // Đám mây tinh vân tím điện - hồng ánh sao
                const g1 = ctx.createRadialGradient(
                    cx - this.width * 0.14 + Math.sin(this.time * 0.004) * 30,
                    cy - this.height * 0.08,
                    10,
                    cx - this.width * 0.1,
                    cy,
                    maxR * 0.68
                );
                g1.addColorStop(0, 'rgba(139, 92, 246, 0.22)');
                g1.addColorStop(0.45, 'rgba(88, 28, 135, 0.12)');
                g1.addColorStop(1, 'rgba(2, 3, 8, 0)');
                ctx.fillStyle = g1;
                ctx.fillRect(-this.width * 0.5, -this.height * 0.5, this.width * 2, this.height * 2);

                // Đám mây tinh vân xanh cyan vũ trụ
                const g2 = ctx.createRadialGradient(
                    cx + this.width * 0.16 + Math.cos(this.time * 0.003) * 35,
                    cy + this.height * 0.1,
                    10,
                    cx + this.width * 0.12,
                    cy + this.height * 0.05,
                    maxR * 0.65
                );
                g2.addColorStop(0, 'rgba(14, 165, 233, 0.20)');
                g2.addColorStop(0.5, 'rgba(30, 58, 138, 0.11)');
                g2.addColorStop(1, 'rgba(2, 3, 8, 0)');
                ctx.fillStyle = g2;
                ctx.fillRect(-this.width * 0.5, -this.height * 0.5, this.width * 2, this.height * 2);

                // Dải ngân hà chéo mờ ảo
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(-0.42);
                const band = ctx.createLinearGradient(0, -this.height * 0.28, 0, this.height * 0.28);
                band.addColorStop(0, 'rgba(2, 3, 8, 0)');
                band.addColorStop(0.5, 'rgba(99, 102, 241, 0.09)');
                band.addColorStop(1, 'rgba(2, 3, 8, 0)');
                ctx.fillStyle = band;
                ctx.fillRect(-this.width * 1.5, -this.height * 0.3, this.width * 3, this.height * 0.6);
                ctx.restore();

                ctx.restore();
            }

            drawCircularWarpAperture(cx, cy) {
                // Giữ vùng tròn ở giữa thông thoáng, không vẽ đường viền hay vòng sáng nào cả
                void cx;
                void cy;
            }

            animate() {
                this.time++;
                // Gia tốc mượt mà theo đường cong tăng tốc
                const lerpRate = this.targetWarpFactor > this.warpFactor ? 0.045 : 0.08;
                this.warpFactor += (this.targetWarpFactor - this.warpFactor) * lerpRate;
                this.warpIntensity = Math.max(0, Math.min(1, (this.warpFactor - 1.3) / 14));

                this.drawNebula();

                const ctx = this.ctx;
                const cx = this.width * 0.5;
                const cy = this.height * 0.5;
                const apertureRadius = this.getApertureRadius();

                // Vẽ các ngôi sao và kéo thành vệt sáng bên ngoài hình tròn trung tâm khi gia tốc warp
                for (let i = 0; i < this.stars.length; i++) {
                    const s = this.stars[i];
                    s.prevX = s.x;
                    s.prevY = s.y;

                    if (this.warpFactor > 1.25) {
                        const dx = s.x - cx;
                        const dy = s.y - cy;
                        const dist = Math.hypot(dx, dy) || 1;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        // Đẩy các ngôi sao ra vùng ngoài vòng tròn trung tâm để giữ hình tròn rõ nét
                        const minOrbitR = apertureRadius + 10;
                        if (dist < minOrbitR) {
                            s.x = cx + nx * (minOrbitR + (minOrbitR - dist) * 0.45);
                            s.y = cy + ny * (minOrbitR + (minOrbitR - dist) * 0.45);
                        }

                        const radialBoost = (this.warpFactor - 1) * 0.022;
                        s.x += nx * (this.warpFactor * 5.2) + dx * radialBoost + s.speedX * this.warpFactor * 3.5;
                        s.y += ny * (this.warpFactor * 5.2) + dy * radialBoost + s.speedY * this.warpFactor * 2.5;
                    } else {
                        s.x += s.speedX * this.warpFactor;
                        s.y += s.speedY * this.warpFactor;
                    }

                    s.phase += s.twinkleSpeed;

                    if (s.x > this.width + 70 || s.x < -70 || s.y < -70 || s.y > this.height + 70) {
                        if (this.warpFactor > 2.5) {
                            // Tái sinh ngay sát mép vòng tròn trung tâm để vệt sáng lao đều ra ngoài
                            const angle = Math.random() * Math.PI * 2;
                            const spawnR = apertureRadius + 8 + Math.random() * 26;
                            s.x = cx + Math.cos(angle) * spawnR;
                            s.y = cy + Math.sin(angle) * spawnR;
                        } else {
                            if (s.x > this.width) s.x = 0;
                            if (s.y < 0) s.y = this.height;
                        }
                        s.prevX = s.x;
                        s.prevY = s.y;
                    }

                    const alpha = s.baseAlpha * (0.65 + 0.35 * Math.sin(s.phase));
                    ctx.save();
                    ctx.globalAlpha = Math.max(0.12, Math.min(1, alpha));

                    if (this.warpFactor > 1.8) {
                        const dx = s.x - cx;
                        const dy = s.y - cy;
                        const dist = Math.hypot(dx, dy) || 1;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        const streakLen = Math.min(130, (this.warpFactor - 1) * 7.2);
                        let tailX = s.x - nx * streakLen;
                        let tailY = s.y - ny * streakLen;

                        // Cắt phần đuôi vệt sáng không tràn vào bên trong hình tròn trung tâm
                        const tailDist = Math.hypot(tailX - cx, tailY - cy);
                        if (tailDist < apertureRadius + 4) {
                            const clampedR = apertureRadius + 4;
                            tailX = cx + nx * clampedR;
                            tailY = cy + ny * clampedR;
                        }

                        const grad = ctx.createLinearGradient(s.x, s.y, tailX, tailY);
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.45, s.color);
                        grad.addColorStop(1, 'rgba(56, 189, 248, 0)');

                        ctx.strokeStyle = grad;
                        ctx.lineWidth = Math.max(0.9, s.radius * 1.15);
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(tailX, tailY);
                        ctx.stroke();
                    } else {
                        ctx.fillStyle = s.color;
                        if (s.radius > 1.35) {
                            ctx.shadowColor = s.color;
                            ctx.shadowBlur = 6;
                        }
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }

                // Vẽ hình tròn trung tâm nổi bật sau lớp sao lao ra ngoài
                this.drawCircularWarpAperture(cx, cy);

                // Thỉnh thoảng tạo sao băng lướt qua khi chưa gia tốc warp
                if (Math.random() < 0.008) {
                    this.spawnShootingStar();
                }

                for (let i = this.shootingStars.length - 1; i >= 0; i--) {
                    const st = this.shootingStars[i];
                    const vx = Math.cos(st.angle) * st.speed;
                    const vy = Math.sin(st.angle) * st.speed;
                    st.x += vx;
                    st.y += vy;
                    st.alpha -= 0.018;

                    if (st.alpha <= 0) {
                        this.shootingStars.splice(i, 1);
                        continue;
                    }

                    const tailX = st.x - Math.cos(st.angle) * st.len;
                    const tailY = st.y - Math.sin(st.angle) * st.len;

                    const grad = ctx.createLinearGradient(st.x, st.y, tailX, tailY);
                    grad.addColorStop(0, `rgba(255, 255, 255, ${st.alpha})`);
                    grad.addColorStop(0.3, `rgba(125, 211, 252, ${st.alpha * 0.6})`);
                    grad.addColorStop(1, 'rgba(56, 189, 248, 0)');

                    ctx.save();
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(st.x, st.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.stroke();
                    ctx.restore();
                }

                requestAnimationFrame(() => this.animate());
            }
        }

        /**
         * 2. BỘ TẠO ÂM THANH GÕ PHÍM CƠ HỌC & HIỆU ỨNG BẬT/TẮT HOLOGRAM (WEB AUDIO API)
         */
        class HologramSoundEngine {
            constructor() {
                this.ctx = null;
                this.noiseBuffer = null;
            }

            unlock() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                        this.createNoiseBuffer();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            createNoiseBuffer() {
                if (!this.ctx) return;
                const length = Math.floor(this.ctx.sampleRate * 0.04);
                const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (length * 0.25));
                }
                this.noiseBuffer = buffer;
            }

            // Tiếng bật màn hình Hologram
            playPowerOn() {
                this.unlock();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(190, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.22);

                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.18, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }

            // Tiếng gõ phím cơ học / tactile switch rõ ràng, êm tai
            playTypeKey(isSpace = false) {
                this.unlock();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;

                // 1. Xung nhịp quang học / hologram chirp nhẹ nhàng, không chói gắt
                const chirpOsc = this.ctx.createOscillator();
                const chirpGain = this.ctx.createGain();
                chirpOsc.type = 'sine';
                const startFreq = isSpace ? 520 : 780 + Math.random() * 240;
                const endFreq = isSpace ? 360 : 1140 + Math.random() * 260;
                chirpOsc.frequency.setValueAtTime(startFreq, now);
                chirpOsc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.026);

                chirpGain.gain.setValueAtTime(0.001, now);
                chirpGain.gain.linearRampToValueAtTime(isSpace ? 0.035 : 0.055, now + 0.006);
                chirpGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.032);

                chirpOsc.connect(chirpGain);
                chirpGain.connect(this.ctx.destination);
                chirpOsc.start(now);
                chirpOsc.stop(now + 0.035);

                // 2. Xung click tinh tế êm tai qua bandpass filter
                if (this.noiseBuffer) {
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = this.noiseBuffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(isSpace ? 1100 : 1650 + Math.random() * 320, now);
                    filter.Q.setValueAtTime(3.0, now);

                    const nGain = this.ctx.createGain();
                    nGain.gain.setValueAtTime(isSpace ? 0.045 : 0.065, now);
                    nGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.022);

                    noise.connect(filter);
                    filter.connect(nGain);
                    nGain.connect(this.ctx.destination);
                    noise.start(now);
                }

                // 3. Âm trầm mềm tạo độ nảy phím hiện đại
                const thockOsc = this.ctx.createOscillator();
                const thockGain = this.ctx.createGain();
                thockOsc.type = 'triangle';
                const baseFreq = isSpace ? 155 : 225 + Math.random() * 40;
                thockOsc.frequency.setValueAtTime(baseFreq, now);
                thockOsc.frequency.exponentialRampToValueAtTime(92, now + 0.028);

                thockGain.gain.setValueAtTime(0.045, now);
                thockGain.gain.exponentialRampToValueAtTime(0.0008, now + 0.03);

                thockOsc.connect(thockGain);
                thockGain.connect(this.ctx.destination);
                thockOsc.start(now);
                thockOsc.stop(now + 0.032);
            }

            // Tiếng tắt nguồn Hologram hạ tần số mượt mà
            playPowerOff() {
                this.unlock();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(480, now);
                osc.frequency.exponentialRampToValueAtTime(68, now + 0.42);

                gain.gain.setValueAtTime(0.14, now);
                gain.gain.exponentialRampToValueAtTime(0.0006, now + 0.46);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.48);
            }

            // Âm thanh gia tốc warp vút đi trước khi thoát trang
            playWarpAcceleration() {
                this.unlock();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const subOsc = this.ctx.createOscillator();
                const ringTone = this.ctx.createOscillator();
                const filter = this.ctx.createBiquadFilter();
                const gain = this.ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.exponentialRampToValueAtTime(860, now + 1.45);

                subOsc.type = 'triangle';
                subOsc.frequency.setValueAtTime(75, now);
                subOsc.frequency.exponentialRampToValueAtTime(290, now + 1.45);

                ringTone.type = 'sine';
                ringTone.frequency.setValueAtTime(420, now);
                ringTone.frequency.exponentialRampToValueAtTime(1240, now + 1.5);

                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(380, now);
                filter.frequency.exponentialRampToValueAtTime(2200, now + 1.4);
                filter.Q.setValueAtTime(1.8, now);

                gain.gain.setValueAtTime(0.001, now);
                gain.gain.linearRampToValueAtTime(0.11, now + 0.35);
                gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.55);

                osc.connect(filter);
                subOsc.connect(filter);
                ringTone.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                subOsc.start(now);
                ringTone.start(now);
                osc.stop(now + 1.6);
                subOsc.stop(now + 1.6);
                ringTone.stop(now + 1.6);
            }
        }

        /**
         * 3. ĐIỀU KHIỂN CHƯƠNG TRÌNH: BẬT MÀN HÌNH -> GÕ CHỮ -> ĐỌC (~9.5s) -> TẮT HẲN -> GIA TỐC -> OUT WEB
         */
        document.addEventListener('DOMContentLoaded', () => {
            const galaxy = new GalaxyBackground(document.getElementById('galaxy-canvas'));
            const sound = new HologramSoundEngine();

            const powerBtn = document.getElementById('holo-power-btn');
            const powerIcon = document.getElementById('power-svg-icon');
            const pulseWave = document.getElementById('btn-pulse-wave');
            const holoFrame = document.getElementById('holo-frame');
            const crtLayer = document.getElementById('crt-screen-layer');
            const flashBeam = document.getElementById('flash-beam-line');
            const projectorBeam = document.getElementById('projector-beam');
            const statusDot = document.getElementById('status-dot');
            const warpVignette = document.getElementById('warp-vignette');
            const warpCenterRing = document.getElementById('warp-center-ring');

            const typedContainer = document.getElementById('typed-lines-container');
            const textViewport = document.getElementById('text-viewport');
            const timerBar = document.getElementById('reading-timer-bar');

            // Trạng thái: 'IDLE' | 'TYPING' | 'READING' | 'SHUTTING_DOWN' | 'EXITED'
            let lifecycleState = 'IDLE';
            let runToken = 0;

            function sleep(ms, token) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (token !== runToken) {
                            reject(new Error('CANCELLED'));
                        } else {
                            resolve();
                        }
                    }, ms);
                });
            }

            function triggerFlashBeam() {
                flashBeam.classList.remove('trigger-flash');
                void flashBeam.offsetWidth;
                flashBeam.classList.add('trigger-flash');
            }

            function setVisualActive(active) {
                if (active) {
                    pulseWave.classList.add('hidden');
                    powerIcon.classList.add('scale-95');
                    projectorBeam.classList.remove('opacity-55');
                    projectorBeam.classList.add('opacity-100');
                    statusDot.classList.remove('bg-cyan-400', 'shadow-[0_0_8px_#38bdf8]');
                    statusDot.classList.add('bg-rose-500', 'shadow-[0_0_10px_#ff1e42]');
                } else {
                    pulseWave.classList.remove('hidden');
                    powerIcon.classList.remove('scale-95');
                    projectorBeam.classList.remove('opacity-100');
                    projectorBeam.classList.add('opacity-0');
                    statusDot.classList.remove('bg-rose-500', 'shadow-[0_0_10px_#ff1e42]');
                    statusDot.classList.add('bg-cyan-400', 'shadow-[0_0_8px_#38bdf8]');
                }
            }

            // Hiệu ứng tăng tốc gia tốc vũ trụ sau khi màn hình hologram tắt hẳn (giữ khoảng tròn thoáng ở giữa)
            async function runAccelerationWarp(token) {
                if (token !== runToken) return;
                warpVignette.classList.add('is-warping');
                warpCenterRing.classList.add('is-active');
                galaxy.setWarpAcceleration(true);
                sound.playWarpAcceleration();

                await sleep(1550, token);
            }

            // Làm trống hoàn toàn trang nếu trình duyệt giữ lại tab sau khi thử đóng / chuyển hướng
            function renderFallbackBlankPage() {
                lifecycleState = 'EXITED';
                try {
                    document.documentElement.style.background = '#020308';
                    document.body.className = '';
                    document.body.style.cssText = 'margin:0;padding:0;width:100vw;height:100vh;background:#020308;overflow:hidden;';
                    document.body.innerHTML = '';
                } catch (e) {
                    // Bỏ qua nếu gặp hạn chế bảo mật
                }
            }

            // Thực hiện thoát web sau khi màn hình hologram biến mất và hiệu ứng gia tốc hoàn tất
            function exitWebApplication() {
                lifecycleState = 'EXITED';
                try {
                    window.open('', '_self');
                    window.close();
                } catch (e) {
                    // Bỏ qua nếu bị trình duyệt chặn
                }

                setTimeout(() => {
                    try {
                        window.location.replace('about:blank');
                    } catch (e) {
                        try {
                            window.location.href = 'about:blank';
                        } catch (err) {
                            renderFallbackBlankPage();
                            return;
                        }
                    }

                    setTimeout(() => {
                        renderFallbackBlankPage();
                    }, 240);
                }, 140);
            }

            // Tắt màn hình hologram biến mất hẳn, tăng tốc gia tốc rồi thoát web
            async function shutdownAndExitScreen(token) {
                if (token !== runToken) return;
                lifecycleState = 'SHUTTING_DOWN';
                powerBtn.disabled = true;

                sound.playPowerOff();
                triggerFlashBeam();

                crtLayer.classList.remove('anim-turn-on');
                crtLayer.classList.add('anim-turn-off');
                setVisualActive(false);

                await sleep(360, token);
                holoFrame.classList.add('holo-vanished');

                await sleep(620, token);
                typedContainer.innerHTML = '';
                timerBar.style.transition = 'none';
                timerBar.style.width = '0%';

                await runAccelerationWarp(token);

                exitWebApplication();
            }

            async function startHologramSequence() {
                if (lifecycleState === 'TYPING' || lifecycleState === 'SHUTTING_DOWN' || lifecycleState === 'EXITED') {
                    return;
                }

                runToken++;
                const currentToken = runToken;

                lifecycleState = 'TYPING';
                powerBtn.disabled = true;
                sound.playPowerOn();
                setVisualActive(true);

                holoFrame.classList.remove('holo-vanished');
                typedContainer.innerHTML = '';
                timerBar.style.transition = 'none';
                timerBar.style.width = '0%';

                crtLayer.classList.remove('screen-off', 'anim-turn-off', 'anim-turn-on');
                void crtLayer.offsetWidth;
                crtLayer.classList.add('anim-turn-on');
                triggerFlashBeam();

                try {
                    await sleep(480, currentToken);

                    const cursor = document.createElement('span');
                    cursor.className = 'holo-cursor';

                    for (let i = 0; i < WISH_PARAGRAPHS.length; i++) {
                        const text = WISH_PARAGRAPHS[i];
                        const p = document.createElement('p');
                        p.className = (i === WISH_PARAGRAPHS.length - 1)
                            ? 'holo-text-closing font-semibold pt-1'
                            : 'holo-text';

                        const textNode = document.createTextNode('');
                        p.appendChild(textNode);
                        p.appendChild(cursor);
                        typedContainer.appendChild(p);

                        for (let c = 0; c < text.length; c++) {
                            const char = text[c];
                            textNode.nodeValue += char;

                            sound.playTypeKey(char === ' ');

                            textViewport.scrollTop = textViewport.scrollHeight;

                            let delay = 28 + Math.random() * 18;
                            if (char === ',' || char === ';') delay += 130;
                            if (char === '.' || char === '!' || char === '?') delay += 220;

                            await sleep(delay, currentToken);
                        }

                        if (i < WISH_PARAGRAPHS.length - 1) {
                            await sleep(340, currentToken);
                        }
                    }

                    // Gõ xong toàn bộ: giữ hiển thị ~9.5 giây vừa đủ đọc rồi biến mất & thoát web
                    lifecycleState = 'READING';
                    powerBtn.disabled = false;
                    const readDurationMs = 9500;

                    timerBar.style.width = '100%';
                    void timerBar.offsetWidth;
                    timerBar.style.transition = `width ${readDurationMs}ms linear`;
                    timerBar.style.width = '0%';

                    await sleep(readDurationMs, currentToken);

                    await shutdownAndExitScreen(currentToken);

                } catch (err) {
                    if (err.message !== 'CANCELLED') {
                        console.error(err);
                    }
                }
            }

            function handlePowerButton() {
                if (lifecycleState === 'IDLE') {
                    startHologramSequence();
                } else if (lifecycleState === 'READING') {
                    runToken++;
                    shutdownAndExitScreen(runToken);
                }
            }

            powerBtn.addEventListener('click', handlePowerButton);

            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    if (lifecycleState === 'IDLE' || lifecycleState === 'READING') {
                        powerBtn.classList.add('pressed');
                        setTimeout(() => powerBtn.classList.remove('pressed'), 120);
                        handlePowerButton();
                    }
                }
            });
        });
    </script>
</body>
